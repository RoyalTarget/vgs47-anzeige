<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBH Wärmebild</title>
<!-- Fußbodenheizung: Rücklauf je Kreis als Wärmebild (30.09.2026). Zeilen = Kreise aus sensor.fbh_kreise (packages/fbh.yaml),
     Spalten = 10-min-Abschnitte. Modus „Abweichung“: Kreis-RL minus gemeinsamer RL an der PMG (blau = kälter = zu wenig
     Durchfluss/langes Rohr, rot = wärmer = zu viel Durchfluss), grau = Heizkreispumpe aus. Modus „Temperatur“: 20–35 °C.
     Daten live aus dem Elternfenster (HA-iframe, gleiche Herkunft): history/history_during_period, 14 Tage.
     Bedienung wie die übrigen Leisten: im Feld ziehen = blättern, Leiste unten: Rahmen ziehen = verschieben, gelbe Griffe =
     zoomen, daneben tippen = springen, Doppelklick/-tippen = Standard (48 h bis jetzt).
     15.10.2026 (Nutzer, Skizze 14.10.): Wärmebild + Hydraulik in einer Kachel. Desktop (≥ 560 px) = Variante A: rechts je Kreis
     RL jetzt, Spreizung (Median Messnächte), Röhrchen Ist/Soll, je Raum Versorgungs-Leiste + Summenzeile „gibt ab · Bedarf“.
     iPhone = Variante B: Wärmebild wie bisher + Punkt = Versorgung des Raums, Kreisname/Punkt antippen = Raum-Bilanz auf/zu.
     Rechnung wie die Markdown-Karte „Hydraulik – Soll und Ist je Raum“ (gibt ab = Röhrchen × Spreizung × 69,78 W je l/min·K,
     Bedarf = JOCO-Heizlast −16 °C linear auf Ø außen der Messnächte). Fußzeile: Messfenster + „Kreis in der Nacht zugegangen“
     (ersetzt die Tabelle „⚖️ Abgleich – Messnächte“). Die Kachel passt ihre Höhe selbst an (Zeilen der HA-Section). -->
<style>
  :root { --bg: #1c1c1c; --fg: #e5e7eb; --grau: #9ca3af; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 12px system-ui, -apple-system, sans-serif; overflow: hidden; }
  #kopf { display: flex; align-items: center; gap: 6px; padding: 6px 10px 0; height: 26px; box-sizing: border-box; }
  #kopf .t { color: var(--grau); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #kopf button { background: #27272a; color: var(--fg); border: 1px solid #52525b; border-radius: 6px; padding: 2px 8px; font: inherit; cursor: pointer; }
  #kopf button.an { background: #3f3f46; border-color: #e5e7eb; }
  #jetzt[hidden] { display: none; }
  canvas { display: block; }
  #feld { touch-action: pan-y; cursor: grab; }
  #leiste { touch-action: none; cursor: pointer; }
  #fuss { padding: 2px 10px 6px; color: var(--grau); font-size: 11px; line-height: 1.5; }
  #fuss b { color: var(--fg); font-weight: 600; }
  #tip { position: fixed; display: none; pointer-events: none; background: rgba(24,24,27,.97); border: 1px solid #52525b; border-radius: 8px;
         padding: 6px 9px; line-height: 1.45; z-index: 5; white-space: nowrap; }
</style>
</head>
<body>
<div id="kopf"><span class="t" id="titel">Rücklauf je Kreis</span>
  <button id="jetzt" hidden title="zurück zu jetzt">↦ Jetzt</button>
  <button id="m_abw" class="an" title="Abweichung vom Mittel aller gemessenen Kreise">Abweichung</button>
  <button id="m_temp" title="Rücklauftemperatur 20–35 °C">Temperatur</button></div>
<canvas id="feld"></canvas>
<canvas id="leiste"></canvas>
<div id="fuss"></div>
<div id="tip"></div>
<script>
const $ = (id) => document.getElementById(id);
const H48 = 48 * 36e5, TAGE = 14, VL = 'sensor.cmi_hk_vorlauf', RLG = 'sensor.cmi_hk_ruecklauf', PU = 'binary_sensor.cmi_hk_pumpe';
let BIN = 6e5;   // 22.10.2026: Website setzt BIN aus den Daten (7 Tage à 30 min), HA bleibt 10 min
let modus = 'abw', win = { live: true, breite: H48, bis: 0 }, daten = null, geo = null;
try { const m = localStorage.getItem('fbh_modus'); if (m === 'temp' || m === 'abw') modus = m; } catch (e) {}

function hassEcht() { try { const h = parent !== window && parent.document.querySelector('home-assistant')?.hass; if (h && h.states) return h; } catch (e) {} return null; }
// Anzeigeseite (03.10.2026): ohne HA kommen die Daten aus dem Gist (fb = [Unix-s, Index, Wert] 10-min-Mittel 48 h, fi = Reihenfolge der Indizes,
// fk = Kreisliste). WEB.h ist dann ein Ersatz-„hass“ mit den letzten Werten, damit Zeichnen/Tooltip unverändert bleiben.
const GIST = 'https://gist.githubusercontent.com/RoyalTarget/f9832b91288808b13a203ac1635b6232/raw/data.json';
const WEB = { h: null, d: null, t: 0 };
function hass() { return hassEcht() || WEB.h; }
function kreise(h) { const k = h?.states['sensor.fbh_kreise']?.attributes?.kreise; return Array.isArray(k) ? k : []; }
const zahl = (v, d = 1) => v === null || v === undefined || isNaN(v) ? '–' : v.toFixed(d).replace('.', ',');

// ---------- Farben ----------
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function skala(stops, v) { if (v <= stops[0][0]) return stops[0][1]; for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
  const [a, ca] = stops[i - 1], [b, cb] = stops[i]; return mix(ca, cb, (v - a) / (b - a)); } return stops[stops.length - 1][1]; }
const S_ABW = [[-3, hex('#2563eb')], [-1.5, hex('#60a5fa')], [-0.4, hex('#3f3f46')], [0.4, hex('#3f3f46')], [1.5, hex('#f87171')], [3, hex('#dc2626')]];
const S_TEMP = [[20, hex('#1e3a8a')], [24, hex('#3b82f6')], [27, hex('#8b5cf6')], [30, hex('#c026d3')], [33, hex('#e11d48')], [35, hex('#f59e0b')]];
const farbe = (v) => { const c = skala(modus === 'abw' ? S_ABW : S_TEMP, v); return `rgb(${c[0]},${c[1]},${c[2]})`; };

// ---------- Daten ----------
async function ws(msg) { const h = hass(); if (!h) throw new Error('kein hass');
  for (let i = 0; i < 3; i++) { try { return await Promise.race([h.callWS(msg), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 20000))]); }
    catch (e) { await new Promise((r) => setTimeout(r, 2000)); } } return {}; }

// zeitgewichtetes Mittel je 10-min-Abschnitt (jeder Wert gilt bis zum nächsten); binär: Anteil „on“
function binne(pkte, t0, n, bin, binaer) {
  const out = new Array(n).fill(null); if (!pkte.length) return out; let i = 0, cur = null;
  for (let k = 0; k < n; k++) { const a = t0 + k * bin, b = a + bin; let t = a, acc = 0, dur = 0;
    while (i < pkte.length && pkte[i][0] <= t) { cur = pkte[i][1]; i++; }
    while (t < b) { const nt = i < pkte.length && pkte[i][0] < b ? pkte[i][0] : b;
      if (cur !== null) { acc += cur * (nt - t); dur += nt - t; } t = nt; if (t < b) { cur = pkte[i][1]; i++; } }
    out[k] = dur > bin / 3 ? acc / dur : (binaer && dur > 0 ? acc / dur : null); }
  return out; }

// 22.10.2026 (Nutzer): Website wieder mit Wärmebild + Hydraulik. Daten aus verlauf.json `fh` (anzeige.yaml): fc = Mittel je `bin` s (30 min, 7 Tage) je Index
// (Reihenfolge FI wie SQL sensor.fbh_waermebild), k = Kreise, ta = Messnächte [Kreis, Spreizung, zu], lf/mf = Messnacht, s = Raum-/Außentemperaturen.
// Personennamen sind dort schon ersetzt (Emil → KiZi/Kinderzimmer) → Raumliste hier passend umbenennen.
const GIST_V = GIST.replace('data.json', 'verlauf.json');
const FI = ['sensor.rl_bad_wand', 'sensor.rl_bad_fussboden', 'sensor.rl_dg_3', 'sensor.rl_dg_4', 'sensor.rl_yoga', 'sensor.rl_og_bad', 'sensor.rl_og_bad_wand', 'sensor.rl_og_flur',
  'sensor.rl_og_5', 'sensor.rl_og_6', 'sensor.rl_wz_1', 'sensor.rl_wz_2', 'sensor.rl_wohnzimmer', 'sensor.rl_wz_aussen', 'sensor.rl_wz_5', 'sensor.rl_wc', 'sensor.rl_flur',
  'sensor.cmi_hk_vorlauf', 'sensor.cmi_hk_ruecklauf', 'sensor.cmi_hk_durchfluss'];
function webOhneNamen() {
  for (const r of RAEUME) if (r[0] === 'Emils Zimmer') r[0] = 'Kinderzimmer';
  if (HT_ORT['Emils Zimmer']) { delete HT_ORT['Emils Zimmer']; HT_ORT['Kinderzimmer'] = 'Kinderzimmer'; }
  if (RAUM_T['Emils Zimmer']) { RAUM_T['Kinderzimmer'] = RAUM_T['Emils Zimmer']; delete RAUM_T['Emils Zimmer']; } }
async function ladeWeb() {
  try { const r = await fetch(GIST_V + '?t=' + Date.now(), { cache: 'no-store' }); WEB.d = (await r.json()).fh; } catch (e) { setTimeout(lade, 30000); return; }
  const d = WEB.d; if (!d || !d.fc || !d.t0) return; webOhneNamen();
  BIN = (d.bin || 600) * 1000;   // 22.10.2026 (Nutzer): Website 7 Tage à 30 min → Leiste zum Zurückblättern
  const K = d.k || [], t0 = d.t0 * 1000, serie = {}; let n = 0;
  FI.forEach((e, i) => { const l = d.fc[i]; if (Array.isArray(l)) { serie[e] = l; n = Math.max(n, l.length); } });
  if (!n) return;
  const tage = (d.ta || []).map((t) => ({ ...t, kr: (t.kr || []).map((r) => [r[0], null, r[1], null, r[2]]) }));
  const states = { 'sensor.fbh_kreise': { attributes: { kreise: K } }, 'sensor.fbh_abgleich': { attributes: { tage, lauf: d.lf || {} } },
    'binary_sensor.fbh_messfenster': { state: (d.mf || [])[0], attributes: { grund: (d.mf || [])[1] } } };
  for (const e in (d.s || {})) states[e] = { state: String(d.s[e]) };
  for (const e in serie) { const s = serie[e]; let l = null; for (let i = s.length - 1; i >= 0; i--) if (s[i] !== null) { l = s[i]; break; } states[e] = { state: String(l) }; }
  WEB.h = { states }; const da = K.filter((k) => serie[k.e]), reihen = {}; for (const k of da) reihen[k.e] = serie[k.e];
  const ref = new Array(n).fill(null);
  for (let i = 0; i < n; i++) { let a = 0, m = 0; for (const e in reihen) { const v = reihen[e][i]; if (v !== null) { a += v; m++; } } if (m >= 2) ref[i] = a / m; }
  const q = serie['sensor.cmi_hk_durchfluss'] || new Array(n).fill(null);
  daten = { t0, n, K, reihen, ref, vl: serie[VL] || new Array(n).fill(null), rl: serie[RLG] || new Array(n).fill(null),
    pu: q.map((v) => v === null ? null : (v > 50 ? 1 : 0)), geladen: Date.now() };
  zeichne();
}
function webHoehe(px) { try { const fr = window.frameElement; if (fr && Math.abs(fr.offsetHeight - px) > 2) fr.style.height = px + 'px'; } catch (e) {} }

async function lade() {
  let inHA = false; try { inHA = parent !== window && !!parent.document.querySelector('home-assistant'); } catch (e) {}
  if (!inHA) { await ladeWeb(); return; }
  const h = hass(); if (!h) { setTimeout(lade, 2000); return; }
  const K = kreise(h), jetzt = Date.now(), t0 = Math.floor((jetzt - TAGE * 864e5) / BIN) * BIN, n = Math.ceil((jetzt - t0) / BIN);
  const da = K.filter((k) => h.states[k.e]), ids = [...da.map((k) => k.e), VL, RLG, PU];
  const r = await ws({ type: 'history/history_during_period', start_time: new Date(t0).toISOString(), end_time: new Date(jetzt).toISOString(),
    entity_ids: ids, minimal_response: true, no_attributes: true, significant_changes_only: false });
  const pk = (id, bin) => (r[id] || []).map((x) => [(x.lu ?? x.last_updated) * 1000, bin ? (x.s === 'on' ? 1 : x.s === 'off' ? 0 : null) : parseFloat(x.s)])
    .filter((p) => bin ? p[1] !== null : !isNaN(p[1]));
  const reihen = {}; for (const k of da) reihen[k.e] = binne(pk(k.e), t0, n, BIN);
  const ref = new Array(n).fill(null);   // Bezug: Mittel aller gemessenen Kreise (Anlegefühler messen systematisch tiefer als der PMG-Fühler)
  for (let i = 0; i < n; i++) { let a = 0, m = 0; for (const e in reihen) { const v = reihen[e][i]; if (v !== null) { a += v; m++; } } if (m >= 2) ref[i] = a / m; }
  daten = { t0, n, K, reihen, ref, vl: binne(pk(VL), t0, n, BIN), rl: binne(pk(RLG), t0, n, BIN), pu: binne(pk(PU, true), t0, n, BIN, true), geladen: jetzt };
  zeichne();
}

// ---------- Fenster ----------
function fenster() { const jetzt = Date.now(), lo = daten ? daten.t0 : jetzt - TAGE * 864e5;
  const b = Math.min(Math.max(win.breite, 3 * 36e5), jetzt - lo); let bis = win.live ? jetzt : Math.min(Math.max(win.bis, lo + b), jetzt);
  return [bis - b, bis, lo, jetzt]; }
function setze(von, bis) { const jetzt = Date.now(); win = { live: bis >= jetzt - 6e4, breite: bis - von, bis };
  $('jetzt').hidden = win.live && Math.abs(win.breite - H48) < 6e4; plan(); }
function standard() { if (raf) { cancelAnimationFrame(raf); raf = null; } win = { live: true, breite: H48, bis: 0 }; $('jetzt').hidden = true; zeichne(); }
let raf = null; const plan = () => { if (!raf) raf = requestAnimationFrame(() => { raf = null; zeichne(); }); };

// ---------- Zeichnen ----------
function leinwand(c, w, h) { const dpr = window.devicePixelRatio || 1; c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  c.style.width = w + 'px'; c.style.height = h + 'px'; const g = c.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); return g; }

// ---------- Hydraulik (15.10.2026) ----------
// Räume: [Name, Heizlast W bei −16 °C (JOCO 2012, DIN EN 12831), Raum-Soll °C, Fühler der Kreise] – wie Markdown „Hydraulik“
// [Name, Norm-Heizlast W bei −16 °C, Norm-Raumtemp. (JOCO 2012, DIN EN 12831), RL-Fühler, Wunschtemp. (Nutzer 19.10.2026)]
// Quelle: Verlegeplan/JOCO_Auslegung_2012.md. Bedarf = Heizlast / (Norm + 16) × (Wunsch − Ø außen); Raum-Farbe gegen Wunsch.
const RAEUME = [
  ['Bad DG', 568, 24, ['sensor.rl_bad_fussboden', 'sensor.rl_bad_wand'], 24],
  ['Gästezimmer', 984, 20, ['sensor.rl_dg_3'], 20],
  ['Lesezimmer', 760, 20, ['sensor.rl_dg_4'], 20],
  ['Yoga', 633, 20, ['sensor.rl_yoga'], 20],
  ['Bad OG', 464, 24, ['sensor.rl_og_bad', 'sensor.rl_og_bad_wand'], 24],
  ['Flur OG', null, 18, ['sensor.rl_og_flur'], 20],
  ['Emils Zimmer', 1068, 20, ['sensor.rl_og_5', 'sensor.rl_og_6'], 22],
  ['Wohnen + WiGa', 3439, 20, ['sensor.rl_wz_1', 'sensor.rl_wz_2', 'sensor.rl_wohnzimmer', 'sensor.rl_wz_aussen', 'sensor.rl_wz_5'], 22],
  ['WC', 154, 20, ['sensor.rl_wc'], 20],
  ['Flur EG', 783, 18, ['sensor.rl_flur'], 20]];
// Raumtemperatur je Raum (19.10.2026, Nutzer): H&T nach Standort (input_select.ht_x_standort, wandert mit), feste Fühler je Raum.
// Daikin nur ganze Grad + Innengerät oben an der Wand → „≈“. Farbe gegen Wunschtemp. (RAEUME): grün ≥ Soll − 0,5, sonst orange.
const HT_ORT = { 'Bad DG': 'Bad DG', 'Bad OG': 'Bad OG', 'WiGa-Ende': 'Wohnen + WiGa', 'WZ-Mitte': 'Wohnen + WiGa', 'Yoga': 'Yoga', 'OG-Flur': 'Flur OG',
  'WC EG': 'WC', 'Flur EG': 'Flur EG', 'Emils Zimmer': 'Emils Zimmer', 'Lesezimmer': 'Lesezimmer', 'Gästezimmer': 'Gästezimmer' };
// 23.10.2026 (Nutzer): WiGa-Daikin raus – Fühler im Innengerät misst die eigene Warmluft (+4…6 K gegen H&T A WiGa-Ende)
const RAUM_T = { 'Wohnen + WiGa': [['sensor.cmi_t_raum', 'WZ']],
  'Emils Zimmer': [['sensor.emil_climatecontrol_raumtemperatur', 'Daikin', 1]] };
function raumTemps(h, name) { const l = [];
  for (const x of ['a', 'b', 'c']) { const o = h?.states['input_select.ht_' + x + '_standort']?.state; if (HT_ORT[o] !== name) continue;
    const v = parseFloat(h?.states['sensor.ht_' + x + '_temperatur']?.state); if (!isNaN(v)) l.push({ k: 'H&T ' + x.toUpperCase() + (o !== name ? ' ' + o : ''), v }); }
  for (const [e, k, g] of (RAUM_T[name] || [])) { const v = parseFloat(h?.states[e]?.state); if (!isNaN(v)) l.push({ k, v, g }); }
  return l; }
function raumSegs(h, r) { const l = raumTemps(h, r.name); if (!l.length) return []; const segs = [];
  l.forEach((t, i) => { segs.push([(i ? ' · ' : '') + t.k + ' ', '#9ca3af'], [(t.g ? '≈ ' + Math.round(t.v) : zahl(t.v)) + ' °C', t.v >= r.soll - 0.5 ? F_GR : F_OR]); });
  segs.push([' / Soll ' + r.soll + ' °C', '#6b7280']); return segs; }
function segsMalen(g, segs, x, y) { g.textAlign = 'left'; for (const [t, f] of segs) { g.fillStyle = f; g.fillText(t, x, y); x += g.measureText(t).width; } return x; }
const F_OR = '#f97316', F_GR = '#22c55e', F_BL = '#60a5fa', F_NA = '#6b7280';
let offen = null;   // iPhone: aufgeklappter Raum (Name)
function hydro(h, K) {
  const T = h?.states['sensor.fbh_abgleich']?.attributes?.tage || [], sp = {}; let nMax = 0;
  for (const k of K) { const l = [], ab = k.ist_ab ? new Date(k.ist_ab).getTime() : 0;   // ist_ab: Röhrchen neu eingestellt → nur Nächte danach
    for (const t of T) { if (ab && new Date(t.start).getTime() < ab) continue; for (const r of (t.kr || [])) if (r[0] === k.k && !r[4]) l.push(r[2]); }
    l.sort((x, y) => x - y); const n = l.length; nMax = Math.max(nMax, n); sp[k.e] = n ? (l[(n - 1) >> 1] + l[n >> 1]) / 2 : null; }
  const vlN = T.length ? T.reduce((s, t) => s + (+t.vl || 0), 0) / T.length : null;
  const au = T.length ? T.reduce((s, t) => s + (+t.au || 0), 0) / T.length : (parseFloat(h?.states['sensor.cmi_t_aussen']?.state) || 10);
  const raum = {}, liste = [];
  for (const [name, last, norm, fu, soll] of RAEUME) {
    let w = 0, ok = true; const ks = [];
    for (const k of K.filter((q) => fu.includes(q.e))) { const e = k.e; ks.push(k);
      const ww = typeof k.ist === 'number' && typeof sp[e] === 'number' ? k.ist * sp[e] * 69.78 : null; if (ww === null) ok = false; else w += ww; }
    const neu = ks.some((k) => k.ist_ab && sp[k.e] === null);
    const bed = typeof last === 'number' ? last * (soll - au) / (norm + 16) : null, p = !neu && bed && bed > 0 ? w / bed * 100 : null;
    const farbe = p === null ? F_NA : p < 70 ? F_OR : p > 140 ? F_BL : F_GR;
    const r = { name, soll, w, ok, bed, p, farbe, neu, ks, letzter: ks.length ? ks[ks.length - 1].e : null, erster: ks.length ? ks[0].e : null };
    liste.push(r); for (const k of ks) raum[k.e] = r; }
  const L = T[T.length - 1], zu = L ? (L.kr || []).filter((r) => r[4]).map((r) => r[0]) : [];
  return { sp, au, vlN, raum, liste, nNacht: nMax, zu, letzte: L };
}
function karteAnpassen(gesamt) {   // HA-Section: Kachelhöhe = Inhalt (Zeile 56 px + 8 px Abstand)
  try { const fr = window.frameElement; if (!fr) return; let e = fr;
    for (let i = 0; i < 12 && e; i++) { if (e.classList && e.classList.contains('card') && e.style.getPropertyValue('--row-size')) break; e = e.parentElement || e.getRootNode()?.host; }
    if (!e || !e.classList?.contains('card')) return; const n = Math.max(4, Math.ceil((gesamt + 12) / 64));
    const setz = () => { const m = e.__fbhN; if (!m) return; if (String(e.style.getPropertyValue('--row-size')).trim() !== String(m)) e.style.setProperty('--row-size', String(m));
      if (e.style.gridRowStart !== `span ${m}`) e.style.gridRow = `span ${m}`; };
    e.__fbhN = n; setz();
    // HA setzt --row-size beim Neuzeichnen der Karte zurück → Stil-Attribut beobachten und wieder setzen
    if (!e.__fbhMo) { e.__fbhMo = new (window.parent.MutationObserver || MutationObserver)(() => setz()); e.__fbhMo.observe(e, { attributes: true, attributeFilter: ['style'] }); } } catch (err) {} }
function fussZeile(h, hy, schmal) {
  const mf = h?.states['binary_sensor.fbh_messfenster'], lauf = h?.states['sensor.fbh_abgleich']?.attributes?.lauf || {};
  let s = mf?.state === 'on' ? `🟢 <b>Messnacht läuft</b> seit ${lauf.start ? new Date(lauf.start).toTimeString().slice(0, 5) : '–'} · ${lauf.n || 0} min (zählt ab 60 min)`
    : `⚪ gerade keine Messung – ${mf?.attributes?.grund || '?'}`;
  if (hy) { s += ` · Kreis in der letzten Nacht zugegangen: ${hy.zu.length ? '<b>🚪 ' + hy.zu.join(', ') + '</b>' : '–'}`;
