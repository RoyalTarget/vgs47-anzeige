<title>FBH Wärmebild</title>
<!-- Fußbodenheizung: Rücklauf je Kreis als Wärmebild (30.09.2026). Zeilen = Kreise aus sensor.fbh_kreise (packages/fbh.yaml),
     Spalten = 10-min-Abschnitte. Modus „Abweichung“: Kreis-RL minus gemeinsamer RL an der PMG (blau = kälter = zu wenig
     Durchfluss/langes Rohr, rot = wärmer = zu viel Durchfluss), grau = am Mittel ±0,4 K, grün-schwarz schraffiert = Heizkreispumpe aus, gelb-schwarz = Ventil zu (2PM) (seit 03.11.2026). Modus „Temperatur“: 20–35 °C.
     Daten live aus dem Elternfenster (HA-iframe, gleiche Herkunft): history/history_during_period, 14 Tage.
     Bedienung wie die übrigen Leisten: im Feld ziehen = blättern, Leiste unten: Rahmen ziehen = verschieben, gelbe Griffe =
     zoomen, daneben tippen = springen, Doppelklick/-tippen = Standard (48 h bis jetzt).
     15.10.2026 (Nutzer, Skizze 14.10.): Wärmebild + Hydraulik in einer Kachel. Desktop (≥ 560 px) = Variante A: rechts je Kreis
     RL jetzt, Spreizung (Median Messnächte), Röhrchen Ist/Soll, je Raum Versorgungs-Leiste + Summenzeile „gibt ab · Bedarf“.
     iPhone = Variante B: Wärmebild wie bisher + Punkt = Versorgung des Raums, Kreisname/Punkt antippen = Raum-Bilanz auf/zu.
     Rechnung wie die Markdown-Karte „Hydraulik – Soll und Ist je Raum“ (gibt ab = Röhrchen × Spreizung × 69,78 W je l/min·K,
     Bedarf = JOCO-Heizlast −16 °C linear auf Ø außen der Messnächte). Fußzeile: Messfenster + „Kreis in der Nacht zugegangen“
     (ersetzt die Tabelle „⚖️ Abgleich – Messnächte“). Die Kachel passt ihre Höhe selbst an (Zeilen der HA-Section). -->
<style>

<script>
const $ = (id) => document.getElementById(id);
const H48 = 48 * 36e5, TAGE = 14, VL = 'sensor.cmi_hk_vorlauf', RLG = 'sensor.hk_ruecklauf', PU = 'binary_sensor.cmi_hk_pumpe';
// 03.11.2026 (Nutzer): WZ 1/2 + WG I/A/W hängen am Shelly 2PM (O1 WZ, O2 WiGa, Antriebe stromlos zu) → „Ventil zu“ exakt aus dem Schalter
const VENTIL = { 'sensor.rl_wz_1': 'switch.wz_antriebe', 'sensor.rl_wz_2': 'switch.wz_antriebe', 'sensor.rl_wohnzimmer': 'switch.wiga_antriebe',
  'sensor.rl_wz_aussen': 'switch.wiga_antriebe', 'sensor.rl_wz_5': 'switch.wiga_antriebe' };
// 20.11.2026 (Nutzer: „zu in alle Kacheln, auch im Wärmebild“): GZ/LZ exakt über die Minis an der Gira-Phase (gira_anforderung.yaml, off = zu).
// Nur in HA (Verlauf der binary_sensoren); die Website hat dafür noch keine Statistik → dort weiter Schätzung.

const ventilZu = (e, i) => { const r = daten?.zu?.[VENTIL[e]]; return !!r && r[i] !== null && r[i] < 0.5; };
// 06.11.2026 (Nutzer): „zu?“ für die übrigen Kreise. (a) Emil: RL-Shellys hängen am Thermostat-Strom → Fühler fehlt bei laufender Pumpe = Thermostat zu (exakt).

// Getestet 03.–06.11. an WZ 1/2 + WG I/A/W gegen die Schalter: 89 % der „zu?“ waren wirklich zu, 88 % der Zu-Zeit erkannt.
const EMIL = ['sensor.rl_og_5', 'sensor.rl_og_6'], ZU_K = 1.0, ZU_MIN = 15 * 6e4;

  const out = {}, nMin = Math.max(1, Math.ceil(ZU_MIN / BIN));
  for (const e in d.reihen) { if (VENTIL[e] && !VENTIL_DG[e]) continue; const r = d.reihen[e], z = new Array(d.n).fill(0);   // 20.11.2026: GZ/LZ weiter schätzen, wo der Mini noch keine Werte hat (vor 20.11.)

  return out; }

let modus = 'abw', win = { live: true, breite: H48, bis: 0 }, daten = null, geo = null;
// 17.11.2026 (Nutzer: „mir ist nur die Abweichung wichtig“): Umschalter Temperatur ausgeblendet, immer Abweichung

  const [a, ca] = stops[i - 1], [b, cb] = stops[i]; return mix(ca, cb, (v - a) / (b - a)); } return stops[stops.length - 1][1]; }

// 17.11.2026 (Nutzer): Streifen = Wärme des Raums ÷ JOCO-Plan, log2-Skala: −1 = halb so viel, +1 = doppelt; grau 0,8–1,25×
const S_Q = [[-1, hex('#2563eb')], [-0.6, hex('#60a5fa')], [-0.32, hex('#3f3f46')], [0.32, hex('#3f3f46')], [0.6, hex('#f87171')], [1, hex('#dc2626')]];

const S_TEMP = [[20, hex('#1e3a8a')], [24, hex('#3b82f6')], [27, hex('#8b5cf6')], [30, hex('#c026d3')], [33, hex('#e11d48')], [35, hex('#f59e0b')]];

// 03.11.2026 (Nutzer): „Pumpe aus“ schraffiert – vorher fast gleiches Grau wie „am Mittel ±0,4 K“ (#3f3f46) → verwechselbar

const ZUMUST = {};
const ZUMUST_S = {};

  const m = g.createPattern(c, 'repeat'); try { m.setTransform(new DOMMatrix().scale(1 / dpr)); } catch (e) {} return (ZUMUST_S[dpr] = m); }

  q.beginPath(); q.moveTo(0, 0); q.lineTo(n, n); q.moveTo(-n / 2, n / 2); q.lineTo(n / 2, n * 1.5); q.moveTo(n / 2, -n / 2); q.lineTo(n * 1.5, n / 2); q.stroke();

// ---------- Daten ----------
async function ws(msg) { const h = hass(); if (!h) throw new Error('kein hass');
  for (let i = 0; i < 3; i++) { try { return await Promise.race([h.callWS(msg), new Promise((_, r) => setTimeout(() => r(new Error('timeout')), 20000))]); }
    catch (e) { await new Promise((r) => setTimeout(r, 2000)); } } return {}; }

// zeitgewichtetes Mittel je 10-min-Abschnitt (jeder Wert gilt bis zum nächsten); binär: Anteil „on“
function binne(pkte, t0, n, bin, binaer) {
  const out = new Array(n).fill(null); if (!pkte.length) return out; let i = 0, cur = null;
  for (let k = 0; k < n; k++) { const a = t0 + k * bin, b = a + bin; let t = a, acc = 0, dur = 0;

    while (t < b) { const nt = i < pkte.length && pkte[i][0] < b ? pkte[i][0] : b;
      if (cur !== null) { acc += cur * (nt - t); dur += nt - t; } t = nt; if (t < b) { cur = pkte[i][1]; i++; } }

// 22.10.2026 (Nutzer): Website wieder mit Wärmebild + Hydraulik. Daten aus verlauf.json `fh` (anzeige.yaml): fc = Mittel je `bin` s (30 min, 7 Tage) je Index
// (Reihenfolge FI wie SQL sensor.fbh_waermebild), k = Kreise, ta = Messnächte [Kreis, Spreizung, zu], lf/mf = Messnacht, s = Raum-/Außentemperaturen.
// Personennamen sind dort schon ersetzt (Emil → KiZi/Kinderzimmer) → Raumliste hier passend umbenennen.
const GIST_V = GIST.replace('data.json', 'verlauf.json');
const FI = ['sensor.rl_bad_wand', 'sensor.rl_bad_fussboden', 'sensor.rl_dg_3', 'sensor.rl_dg_4', 'sensor.rl_yoga', 'sensor.rl_og_bad', 'sensor.rl_og_bad_wand', 'sensor.rl_og_flur',
  'sensor.rl_og_5', 'sensor.rl_og_6', 'sensor.rl_wz_1', 'sensor.rl_wz_2', 'sensor.rl_wohnzimmer', 'sensor.rl_wz_aussen', 'sensor.rl_wz_5', 'sensor.rl_wc', 'sensor.rl_flur',
  'sensor.cmi_hk_vorlauf', 'sensor.hk_ruecklauf', 'sensor.cmi_hk_durchfluss', 'sensor.wz_ventile_offen', 'sensor.wiga_ventile_offen', 'sensor.cmi_t_aussen',
  'sensor.gz_ventile_offen', 'sensor.lz_ventile_offen'];
// 06.11.2026 (Nutzer „Website zeigt altes Wärmebild“): Ventile WZ/WiGa als 0/1-Statistik (ventil_statistik.yaml) → wie im Dashboard „Ventil zu“
const WEB_ZU = { 'switch.wz_antriebe': 'sensor.wz_ventile_offen', 'switch.wiga_antriebe': 'sensor.wiga_ventile_offen',
  'binary_sensor.gz_waermeanforderung': 'sensor.gz_ventile_offen', 'binary_sensor.lz_waermeanforderung': 'sensor.lz_ventile_offen' };   // 20.11.2026: GZ/LZ (Minis an der Gira-Phase), SQL-Index 23/24
function webOhneNamen() {
