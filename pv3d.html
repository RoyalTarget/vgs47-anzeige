<title>PV-Anlage 3D</title>

     Färbung nach aktueller Leistung, Mouse-over/Antippen = Werte der Fläche.
     Daten: im HA-iframe live aus dem Elternfenster (gleiche Herkunft), sonst aus dem Gist der Anzeigeseite. -->
<style>

  #tip { position: absolute; display: none; pointer-events: none; background: rgba(24,24,27,.96); border: 1px solid #52525b; border-radius: 8px;
         padding: 8px 10px; line-height: 1.5; box-shadow: 0 4px 14px rgba(0,0,0,.5); max-width: 240px; z-index: 5; }
  #tip .n { font-weight: 700; font-size: 14px; } #tip .g { color: var(--grau); }
  @media (max-width: 520px) { #hinweis { max-width: 55%; } }
  #legende { position: absolute; right: 10px; top: 8px; font-size: 11px; color: var(--grau); text-align: right; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #legende .bar { width: 120px; height: 8px; border-radius: 4px; margin: 3px 0 2px auto; background: linear-gradient(90deg, #1e293b, #b45309, #facc15, #fef9c3); }
</style>

<script type="module">

  dach_west: { name: 'Dach West', sub: 'RS 450 #5 · Straßenseite (NW), 40°', n: 5, p: 'sensor.mppt2_leistung_pv_tracker_5_dach_west', h: 'sensor.mppt2_ertrag_tracker_5_dach_west_heute', m: 'sensor.mppt2_maximalleistung_tracker_5_dach_west_heute' },

  fassade_unten: { name: 'Fassade Süd unten', sub: 'RS 450 #4 · Südwest-Giebel, senkrecht', n: 4, p: 'sensor.mppt2_leistung_pv_tracker_4_sued_unten', h: 'sensor.mppt2_ertrag_tracker_4_sued_unten_heute', m: 'sensor.mppt2_maximalleistung_tracker_4_sued_unten_heute' },

// ---------- Szene ----------
const cv = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x111418);

// Standardansicht (Nutzer 30.09.2026): frontal auf den Südwest-Giebel, schräg von oben, beide Dachseiten sichtbar.
// 📌 merkt die aktuelle Ansicht in diesem Browser (localStorage), ⟲ springt dorthin; Doppelklick auf ⟲ = Standard.
const START = { pos: new THREE.Vector3(-13.05, 17.6, 8.55), ziel: new THREE.Vector3(0, 5, 0) };
const gemerkt = () => { try { const g = JSON.parse(localStorage.getItem('pv3d_blick') || 'null'); return g && g.pos && g.ziel ? g : null; } catch (e) { return null; } };

  cam.position.copy(g ? new THREE.Vector3(...g.pos) : START.pos); controls.target.copy(g ? new THREE.Vector3(...g.ziel) : START.ziel); controls.update(); };

const himmelLicht = new THREE.HemisphereLight(0xdbe7ff, 0x303030, 0.55); scene.add(himmelLicht);
const sonne = new THREE.DirectionalLight(0xfff4dd, 1.6); sonne.castShadow = true;
sonne.shadow.mapSize.set(2048, 2048); Object.assign(sonne.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 80 });
scene.add(sonne); scene.add(sonne.target);

// Boden + Nordpfeil
const boden = new THREE.Mesh(new THREE.CircleGeometry(20, 64), new THREE.MeshStandardMaterial({ color: 0x1f2a1f, roughness: 1 }));
boden.rotation.x = -Math.PI / 2; boden.receiveShadow = true; scene.add(boden);
{ const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.fillStyle = '#e5e7eb'; g.beginPath(); g.moveTo(64, 8); g.lineTo(88, 70); g.lineTo(64, 58); g.lineTo(40, 70); g.closePath(); g.fill();
  g.font = 'bold 40px system-ui'; g.textAlign = 'center'; g.fillText('N', 64, 118);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  m.rotation.x = -Math.PI / 2; m.position.set(0, 0.02, -14); scene.add(m); }

// Haus-Gruppe (Hauskoordinaten → three: X = x, Y = z, Z = y), um die Mitte zentriert und nach Himmelsrichtung gedreht
const haus = new THREE.Group(); const inner = new THREE.Group(); inner.position.set(-B / 2, 0, -T / 2); haus.add(inner);
haus.rotation.y = AUSRICHTUNG * Math.PI / 180; scene.add(haus);
const P = (x, y, z) => new THREE.Vector3(x, z, y);
const matWand = new THREE.MeshStandardMaterial({ color: 0xd8cfb3, roughness: 0.9, side: THREE.DoubleSide });
const matDach = new THREE.MeshStandardMaterial({ color: 0x5a3b35, roughness: 0.85, side: THREE.DoubleSide });
const matGaube = new THREE.MeshStandardMaterial({ color: 0x6b7280, roughness: 0.8, side: THREE.DoubleSide });
const matBlech = new THREE.MeshStandardMaterial({ color: 0x4b5563, roughness: 0.6, metalness: 0.3, side: THREE.DoubleSide });
const matGlas = new THREE.MeshStandardMaterial({ color: 0xbfdbfe, roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.45, side: THREE.DoubleSide });
const matGlasDach = new THREE.MeshStandardMaterial({ color: 0x5b84b1, roughness: 0.05, metalness: 0.5, transparent: true, opacity: 0.75, side: THREE.DoubleSide });   // Glas-Firstaufbau: dunkler, spiegelnd wie auf dem Foto
const matFenster = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.2, metalness: 0.2 });
function poly(punkte, mat, schatten = true) {   // ebenes Vieleck aus Hauskoordinaten (Fächer-Dreiecke)
  const g = new THREE.BufferGeometry();
  const arr = []; for (let i = 1; i < punkte.length - 1; i++) for (const p of [punkte[0], punkte[i], punkte[i + 1]]) { const q = P(...p); arr.push(q.x, q.y, q.z); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat); m.castShadow = schatten; m.receiveShadow = true; inner.add(m); return m;
}
function kiste(x0, x1, y0, y1, z0, z1, mat) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, z1 - z0, y1 - y0), mat);
  m.position.copy(P((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2)); m.castShadow = true; m.receiveShadow = true; inner.add(m); return m;
}
// Außenwände + Giebel
kiste(0, B, 0, T, 0, TR, matWand);
for (const x of [0, B]) poly([[x, 0, TR], [x, T, TR], [x, T / 2, FI]], matWand);
// Hauptdach mit Überstand (Gaubenbereich wird von den Gauben überdeckt)
const zDach = (y) => TR + NEIG * (y <= T / 2 ? y : T - y);
poly([[-UEBX, -UEB, TR - NEIG * UEB], [B + UEBX, -UEB, TR - NEIG * UEB], [B + UEBX, T / 2, FI], [-UEBX, T / 2, FI]], matDach);
poly([[-UEBX, T + UEB, TR - NEIG * UEB], [B + UEBX, T + UEB, TR - NEIG * UEB], [B + UEBX, T / 2, FI], [-UEBX, T / 2, FI]], matDach);
// Gauben (Garten SO: y ab 0 nach innen, Straße NW: y ab 9.5 nach innen)
function gaube([xa, xb], seite) {
  const Y = (d) => seite === 'so' ? d : T - d;
  poly([[xa, Y(0), TR], [xb, Y(0), TR], [xb, Y(0), GZ], [xa, Y(0), GZ]], matGaube);                                   // Front
  for (const x of [xa, xb]) poly([[x, Y(0), TR], [x, Y(0), GZ], [x, Y(GTIEF), GZ + G7 * GTIEF]], matGaube);           // Wangen
  poly([[xa - 0.15, Y(-0.35), GZ - G7 * 0.35], [xb + 0.15, Y(-0.35), GZ - G7 * 0.35], [xb + 0.15, Y(GTIEF), GZ + G7 * GTIEF], [xa - 0.15, Y(GTIEF), GZ + G7 * GTIEF]], matBlech);  // Dach 7°
  const fy = seite === 'so' ? -0.02 : T + 0.02, fm = new THREE.Mesh(new THREE.PlaneGeometry(xb - xa - 0.8, 1.2), matFenster);   // Fensterband
  fm.position.copy(P((xa + xb) / 2, fy, TR + 1.0)); if (seite === 'so') fm.rotation.y = Math.PI; inner.add(fm);
}
gaube(GAUBE_SO, 'so'); gaube(GAUBE_NW, 'nw');
// Motorfenster (Nutzer 05.10.2026): je Glasseite die mittlere Scheibe, oben am First angeschlagen (Kettenantrieb D+H),
// West = Straßenseite (NW, Shelly 2PM cover.fenster_west), Ost = Gartenseite (SO, Shelly 2PM cover.fenster_ost seit 06.10.2026). Bei 100 % ≈ 85° gegen senkrecht = 5° unter waagrecht (Nutzer 06.10.2026, vorher fälschlich 10° darüber).
// Position im HA-iframe live, auf der Anzeigeseite aus data.json „fe“ (seit 06.10.2026).
const FENSTER = { west: 'cover.fenster_west', ost: 'cover.fenster_ost' }, OFFEN_UEBER_WAAGRECHT = -5, FLUEGEL = {};
// Glas-Firstaufbau (Foto 01.10.2026): sitzt AUF dem First – graue senkrechte Wände ≈ 0,45 m über der Dachfläche,
// darauf ein Satteldach aus Glas (je Seite 3 Scheiben mit hellen Rahmen), First ≈ 0,3 m über dem Hausfirst.
// Vorher lag er mit +9,05/+9,45 unter der Dachfläche (First +10,07) und war unsichtbar.
{ const xa = 1.1, xb = 4.6, y0 = T / 2 - 1.0, y1 = T / 2 + 1.0, zw = zDach(y0) + 0.45, zf = FI + 0.3;   // endet ≈ 4,7 m von der Wand zu Nr. 45 (Drohnenfoto)
  const matRahmen = new THREE.MeshStandardMaterial({ color: 0xc7ccd3, roughness: 0.5, metalness: 0.4, side: THREE.DoubleSide });
  for (const y of [y0, y1]) poly([[xa, y, zDach(y) - 0.2], [xb, y, zDach(y) - 0.2], [xb, y, zw], [xa, y, zw]], matRahmen);
  for (const x of [xa, xb]) poly([[x, y0, zDach(y0) - 0.2], [x, T / 2, FI], [x, y1, zDach(y1) - 0.2], [x, y1, zw], [x, T / 2, zf], [x, y0, zw]], matRahmen);
  const x3 = [xa, xa + (xb - xa) / 3, xa + 2 * (xb - xa) / 3, xb];
  for (const [y, seite] of [[y0, 'ost'], [y1, 'west']]) {
    for (const [a, b] of [[x3[0], x3[1]], [x3[2], x3[3]]]) poly([[a, y, zw], [b, y, zw], [b, T / 2, zf], [a, T / 2, zf]], matGlasDach, false);
    const an = P(x3[1], T / 2, zf), rel = (q) => P(...q).sub(an), dreh = new THREE.Group(); dreh.position.copy(an); inner.add(dreh);
    const e = [[x3[1], y, zw], [x3[2], y, zw], [x3[2], T / 2, zf], [x3[1], T / 2, zf]].map(rel), g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([e[0], e[1], e[2], e[0], e[2], e[3]].flatMap((v) => [v.x, v.y, v.z]), 3)); g.computeVertexNormals();
    dreh.add(new THREE.Mesh(g, matGlasDach));
    for (const [i, j] of [[0, 1], [1, 2], [2, 3], [3, 0]]) { const v = e[j].clone().sub(e[i]), k = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, v.length()), matRahmen);   // Flügelrahmen ringsum
      k.position.copy(e[i]).add(e[j]).multiplyScalar(0.5); k.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), v.clone().normalize()); k.position.y += 0.03; dreh.add(k); }
    FLUEGEL[seite] = { dreh, vz: y > T / 2 ? -1 : 1, max: Math.atan2(zf - zw, T / 2 - y0) + OFFEN_UEBER_WAAGRECHT * Math.PI / 180, ist: 0, soll: 0, pos: 0 };
  }
  // Rahmen: Sprossen zwischen den Scheiben (quer zum First), Traufkante und Firstkappe
  const stab = (p, q, d = 0.07) => { const v = P(...q).sub(P(...p)), m = new THREE.Mesh(new THREE.BoxGeometry(d, d, v.length()), matRahmen);
    m.position.copy(P(...p).add(P(...q)).multiplyScalar(0.5)); m.lookAt(P(...q)); inner.add(m); };
  for (const x of [xa, xa + (xb - xa) / 3, xa + 2 * (xb - xa) / 3, xb]) for (const y of [y0, y1]) stab([x, y, zw + 0.02], [x, T / 2, zf + 0.02]);
  for (const y of [y0, y1]) stab([xa, y, zw + 0.02], [xb, y, zw + 0.02], 0.09);
  stab([xa, T / 2, zf + 0.04], [xb, T / 2, zf + 0.04], 0.12); }
// Südwest-Giebel (Nutzer 30.09.2026): oben zwei ganz kleine Fenster, darunter die 8 Module, darunter zwei Fenstertüren,
// die unten auf der Dachterrasse der Garage enden. Lage/Höhen aus der Südwest-Ansicht (Maßstab ≈ 84 px/m).
const fenster = (y, z, b, h) => { const f = new THREE.Mesh(new THREE.PlaneGeometry(b, h), matFenster); f.position.copy(P(B + 0.02, y, z)); f.rotation.y = Math.PI / 2; inner.add(f); };
for (const y of [3.55, 5.95]) fenster(y, 3.66, 1.0, 2.0);           // Fenstertüren (OG) auf die Garagenterrasse, direkt unter dem Modulfeld
for (const y of [3.55, 5.95]) fenster(y, 7.35, 0.9, 0.6);           // kleine Giebelfenster, direkt über dem Modulfeld (Foto 30.09.2026)
// Garage vor dem Giebel (3,12 m tief) mit Holz-Dachterrasse (ohne Geländer, Nutzer 30.09.2026)
const GAR = [1.4, 7.3], GH = 2.6;   // 01.10.2026: ≈ 1 m Richtung Garten – endet kurz vor dem Kamin, fast bündig mit dem Modulfeld (Foto)
kiste(B, B + 3.12, GAR[0], GAR[1], 0, GH, matWand);
kiste(B, B + 3.12, GAR[0], GAR[1], GH, GH + 0.08, new THREE.MeshStandardMaterial({ color: 0x8b6b4a, roughness: 0.9 }));
// Stahlkamin an der Gartenecke des Giebels (neben der Garage)
{ const k = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 11.2, 20), new THREE.MeshStandardMaterial({ color: 0xcbd5e1, metalness: 0.7, roughness: 0.3 }));
  k.position.copy(P(B + 0.25, 0.15, 5.6)); k.castShadow = true; inner.add(k); }   // Kamin an der Gartenecke des Giebels (Nutzer)
// Windfang Straßenseite (Dach 7°, +2,85) und Wintergarten Gartenseite (Glas)
const WF = [1.2, 3.9], WFT = 1.9;
kiste(WF[0], WF[1], T, T + WFT, 0, 2.62, matWand);
poly([[WF[0] - 0.1, T, 2.85], [WF[1] + 0.1, T, 2.85], [WF[1] + 0.1, T + WFT + 0.15, 2.85 - G7 * (WFT + 0.15)], [WF[0] - 0.1, T + WFT + 0.15, 2.85 - G7 * (WFT + 0.15)]], matBlech);

// ---------- Module ----------
// Zellbild als Textur (Halbzellen: sichtbare Mittelteilung), Farbe = Leistung (dunkel → bernstein → gelb)
function zellTextur(hochkant) {
  const c = document.createElement('canvas'); c.width = hochkant ? 120 : 186; c.height = hochkant ? 186 : 120; const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1;
  const nx = hochkant ? 6 : 10, ny = hochkant ? 10 : 6;
  for (let i = 1; i < nx; i++) { g.beginPath(); g.moveTo(i * c.width / nx, 0); g.lineTo(i * c.width / nx, c.height); g.stroke(); }
  for (let j = 1; j < ny; j++) { g.beginPath(); g.moveTo(0, j * c.height / ny); g.lineTo(c.width, j * c.height / ny); g.stroke(); }
  g.lineWidth = 3; g.strokeStyle = 'rgba(0,0,0,0.6)'; g.beginPath();
  if (hochkant) { g.moveTo(0, c.height / 2); g.lineTo(c.width, c.height / 2); } else { g.moveTo(c.width / 2, 0); g.lineTo(c.width / 2, c.height); } g.stroke();
  g.lineWidth = 4; g.strokeStyle = '#9ca3af'; g.strokeRect(0, 0, c.width, c.height);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEX = { hoch: zellTextur(true), quer: zellTextur(false) };
const module = [];
// Modul auf eine Ebene legen: Mitte (Hauskoordinaten), Richtungen u (Breite) / v (Länge) als Einheitsvektoren in Hauskoordinaten
function modul(key, mitte, u, v, bu, bv, aussen = [0, 0, 1], geplant = false) {   // aussen = Richtung, in die die Zellseite zeigen soll (Hauskoordinaten)
  const hoch = bv > bu, mat = new THREE.MeshStandardMaterial({ map: hoch ? TEX.hoch : TEX.quer, color: 0x1e293b, roughness: 0.35, metalness: 0.2, emissive: 0x000000 });
  let U = P(...u).normalize(); const V = P(...v).normalize(); let N = new THREE.Vector3().crossVectors(U, V).normalize();
  if (N.dot(P(...aussen)) < 0) { U.negate(); N = new THREE.Vector3().crossVectors(U, V).normalize(); }
  const m = new THREE.Mesh(new THREE.BoxGeometry(bu, bv, MD), [matBlech, matBlech, matBlech, matBlech, mat, matBlech]);
  m.setRotationFromMatrix(new THREE.Matrix4().makeBasis(U, V, N)); m.position.copy(P(...mitte)).addScaledVector(N, 0.06);

// Gauben: 3 hochkant nebeneinander auf dem 7°-Dach, Länge in Gefällerichtung
for (const [key, [xa, xb], so] of [['gaube_ost', GAUBE_SO, true], ['gaube_west', GAUBE_NW, false]]) {
  const xm = (xa + xb) / 2, dm = 1.25, y = so ? dm : T - dm, z = GZ + G7 * dm;

{ const cosA = 1 / Math.hypot(1, NEIG), xm = GAUBE_NW[1] + 0.4, s0 = 0.55, s1 = 1.6;

for (const [key, xm, so] of [['dach_west', 5.3, false], ['dach_ost', 5.2, true]]) {

// ---------- Sonnenstand (NOAA-Näherung, München) → Licht ----------
const EL_TEST = parseFloat(new URLSearchParams(location.search).get('el'));
function sonnenstand(d = new Date(), lat = 48.115, lon = 11.525) {
  const rad = Math.PI / 180, jd = d.getTime() / 864e5 + 2440587.5, n = jd - 2451545.0;
  const L = (280.46 + 0.9856474 * n) % 360, g = (357.528 + 0.9856003 * n) % 360;
  const lam = L + 1.915 * Math.sin(g * rad) + 0.02 * Math.sin(2 * g * rad), eps = 23.439 - 0.0000004 * n;
  const ra = Math.atan2(Math.cos(eps * rad) * Math.sin(lam * rad), Math.cos(lam * rad)), dec = Math.asin(Math.sin(eps * rad) * Math.sin(lam * rad));
  const gmst = (18.697374558 + 24.06570982441908 * n) % 24, lst = (gmst * 15 + lon) * rad, ha = lst - ra;
  const el = Math.asin(Math.sin(lat * rad) * Math.sin(dec) + Math.cos(lat * rad) * Math.cos(dec) * Math.cos(ha));
  const az = Math.atan2(-Math.sin(ha), Math.tan(dec) * Math.cos(lat * rad) - Math.sin(lat * rad) * Math.cos(ha));
  return { el: isNaN(EL_TEST) ? el / rad : EL_TEST, az: ((az / rad) + 360) % 360 };
}
function sonneSetzen() {
  const s = sonnenstand(), el = Math.max(s.el, -5) * Math.PI / 180, az = s.az * Math.PI / 180, r = 40;
  sonne.position.set(r * Math.cos(el) * Math.sin(az), r * Math.sin(Math.max(el, 0.03)), -r * Math.cos(el) * Math.cos(az));
  sonne.intensity = (s.el > 0 ? 0.6 + 1.2 * Math.min(s.el / 30, 1) : 0.15) * HELL.licht;

}
// Tag-Nacht-Verlauf (02.10.2026): Hintergrund, Boden, Himmelslicht und Sonnenfarbe folgen fließend der Sonnenhöhe.
// Tag bewusst gedämpft (dunkles Dashboard). Test: pv3d.html?el=-12 / 0 / 40 setzt die Sonnenhöhe fest.
const STUFEN = [   // [Sonnenhöhe °, Hintergrund, Boden, Himmelslicht, Sonnenfarbe]
  [-10, 0x0b1020, 0x0c120c, 0.20, 0xffd2a0],   // Nacht
  [-3, 0x2a2142, 0x141a14, 0.30, 0xff8a4c],    // blaue Stunde / Dämmerung
  [3, 0x4b3349, 0x1c261b, 0.42, 0xff9a55],     // Sonnenauf-/-untergang
  [12, 0x44566a, 0x26381f, 0.60, 0xffe2b8],    // Morgen / Abend
  [30, 0x50657c, 0x2c4224, 0.72, 0xfff4dd]];   // Tag
// Etwas heller (09.10.2026, Nutzer: „einen Tick heller für alle Phasen“): Licht × 1,2 (+ Grundlicht), Himmel/Boden 8 % Richtung Weiß
const HELL = { licht: 1.2, himmel: 0.08, farbe: 0.08 };

  const k = STUFEN, n = k.length; let a = k[n - 1], b = k[n - 1], t = 0;
  for (let j = 1; j < n; j++) if (el < k[j][0]) { a = k[j - 1]; b = k[j]; t = Math.max(0, (el - a[0]) / (b[0] - a[0])); break; }
  const mix = (c1, c2) => new THREE.Color(c1).lerp(new THREE.Color(c2), t).lerp(new THREE.Color(0xffffff), HELL.farbe);
  const bg = mix(a[1], b[1]); scene.background = bg; document.body.style.background = '#' + bg.getHexString();
  boden.material.color.copy(mix(a[2], b[2]));
  himmelLicht.intensity = (a[3] + (b[3] - a[3]) * t) * HELL.licht + HELL.himmel;

// ---------- Daten ----------
const GIST = 'https://gist.githubusercontent.com/RoyalTarget/f9832b91288808b13a203ac1635b6232/raw/data.json';
let quelle = 'ha';
function haZustaende() { try { const h = parent !== window && parent.document.querySelector('home-assistant')?.hass; if (h && h.states) return h.states; } catch (e) {} return null; }
async function werte() {
  const st = haZustaende();
  if (st) { quelle = 'ha'; const w = (e) => { const x = e && st[e]; if (!x) return null; let v = parseFloat(x.state); if (isNaN(v)) return null;
      const u = x.attributes?.unit_of_measurement; if (u === 'Wh') v /= 1000; if (u === 'kW') v *= 1000; return v; }; return w; }
  quelle = 'web';
  if (!werte.cache || Date.now() - werte.cache.t > 25000) { try { const r = await fetch(GIST + '?t=' + Date.now(), { cache: 'no-store' }); werte.cache = { t: Date.now(), d: await r.json() }; } catch (e) {} }
  const d = werte.cache?.d || {}; return (e) => { if (!e) return null; if (d.k && d.k[e] != null) return d.k[e]; const v = parseFloat((d.s || {})[e]); return isNaN(v) ? null : v; };
}

  r = Math.max(0, Math.min(r, 1)); return r < 0.35 ? c1.lerp(c2, r / 0.35) : r < 0.8 ? c2.lerp(c3, (r - 0.35) / 0.45) : c3.lerp(c4, (r - 0.8) / 0.2); };

const stand = {};

    const col = farbe(p / f.n / PMOD);

  const s = sonneSetzen(); let fText = '';
  for (const [seite, ent] of Object.entries(FENSTER)) { const f = FLUEGEL[seite], x = ent && st && st[ent];
    const pos = x ? Math.max(0, Math.min(Number(x.attributes?.current_position ?? (x.state === 'open' ? 100 : 0)) || 0, 100)) : 0;
    f.pos = pos; f.soll = f.max * pos / 100; if (pos > 0) fText += `${fText ? ' · ' : ''}🪟 ${seite === 'west' ? 'West' : 'Ost'} ${pos} %`; }
  if (Object.values(FLUEGEL).some((f) => Math.abs(f.soll - f.ist) > 0.001)) anfordern();

  document.getElementById('kopf2').textContent = `heute ${zahl(heute, 1)} kWh · Sonne ${s.el > 0 ? zahl(s.el) + '° hoch, aus ' + himmel(s.az) : 'unter dem Horizont'}${quelle === 'web' ? ' · Stand ≤ 1 min' : ''}`;
  document.getElementById('kopf3').textContent = fText;   // Fenster eigene Zeile (06.10.2026: kollidierte am iPhone mit der Legende)

const himmel = (az) => ['N', 'NO', 'O', 'SO', 'S', 'SW', 'W', 'NW'][Math.round(az / 45) % 8];

// ---------- Mouse-over / Antippen ----------
const tip = document.getElementById('tip'), ray = new THREE.Raycaster(), maus = new THREE.Vector2();
let hover = null;

  ray.setFromCamera(maus, cam); const t = ray.intersectObjects(module, false)[0]; return t ? (t.object.userData.geplant ? 'geplant:' + t.object.userData.key : t.object.userData.key) : null; }

  if (!key) { tip.style.display = 'none'; return; }

    tip.innerHTML = `<div class="n">Geplant: 3 Module</div><div class="g">kommen an den String <b>${f.name}</b> (${f.sub.split(' · ')[0]})</div>gleiche Ausrichtung und Neigung wie die Dachmodule`;
  } else {
  const f = F[key], s = stand[key] || {}, anteil = s.p != null ? s.p / f.n : null;
  tip.innerHTML = `<div class="n">${f.name}</div><div class="g">${f.sub} · ${f.n} Module</div>`
    + `jetzt <b>${zahl(s.p)} W</b> <span class="g">(≈ ${zahl(anteil)} W je Modul, ${zahl(anteil / PMOD * 100)} %)</span><br>`

  for (const { s } of Object.values(schilder)) { s.getWorldPosition(wp); const d = wp.distanceTo(cam.position);
    sr.set(cam.position, wp.clone().sub(cam.position).normalize()); sr.far = d - 0.4; s.visible = sr.intersectObjects(vd, false).length === 0; } }
// Zeichnen nur bei Bedarf (04.10.2026): vorher Dauerschleife mit 60 Bildern/s → iPhone/Dashboard träge.
// Jetzt: beim Drehen (inkl. Auslaufen der Dämpfung), nach neuen Werten, nach Größenänderung; sonst steht die Szene.
let fr = 0, laeuft = false, bedarf = true, zieht = false;

anfordern();
